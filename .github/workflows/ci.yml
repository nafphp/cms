name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer analyse

  php:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            dependencies: locked
            experimental: false
          - php: '8.3'
            dependencies: lowest
            experimental: false
          - php: '8.4'
            dependencies: locked
            experimental: false
          - php: '8.5'
            dependencies: locked
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
      - if: matrix.dependencies == 'lowest'
        run: composer update 'naf/*' --prefer-lowest --with-all-dependencies --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test
      - run: vendor/bin/naf docs:check
      - run: vendor/bin/naf integrity:check

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:builder
      - run: npm run test:assets
      - run: npm run build
      - run: git diff --exit-code -- public/css/nafcms.css

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer audit --locked

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, pdo_sqlite
          coverage: none
      - run: scripts/check-package.sh
      - run: scripts/package-smoke.sh

  mariadb-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: nafcms
          MARIADB_USER: nafcms
          MARIADB_PASSWORD: nafcms
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: nafcms
      DB_PASSWORD: nafcms
      DB_DATABASE: nafcms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/naf db:migrate up
